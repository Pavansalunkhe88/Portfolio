<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="finderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
  </defs>
  <!-- Face background -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="url(#finderGrad)"/>
  <!-- Face -->
  <ellipse cx="32" cy="34" rx="18" ry="20" fill="#fff" opacity="0.15"/>
  <!-- Left eye -->
  <ellipse cx="24" cy="28" rx="3.5" ry="5" fill="white"/>
  <ellipse cx="24" cy="29" rx="2" ry="3" fill="#1a1a2e"/>
  <!-- Right eye -->
  <ellipse cx="40" cy="28" rx="3.5" ry="5" fill="white"/>
  <ellipse cx="40" cy="29" rx="2" ry="3" fill="#1a1a2e"/>
  <!-- Smile -->
  <path d="M22 40 Q32 50 42 40" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <line x1="32" y1="30" x2="32" y2="38" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
